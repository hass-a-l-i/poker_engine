[build-system]
requires = ["setuptools>=61.0"]
#requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-engine"
version = "0.1.0"
authors = [{name = "Hassan Ali"}]
readme = "README.md"
requires-python = ">=3.10"
description = "Texas hold-em poker engine"
dependencies = [
    "numpy",
    "qiskit",
    "qiskit-aer",
]

[project.scripts]
poker-engine = "poker_engine.engine:main"

[tool.setuptools.packages.find]
where = ["src"]
